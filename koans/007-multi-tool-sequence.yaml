name: multi-tool-sequence
description: >
  A task that requires two different tools in sequence. The agent must
  invoke each tool with the model's arguments, feed each result back to
  the model in turn, and only then report the combined final answer.

given:
  task: "Report the current weather and local time in Tokyo."
  tools:
    get_weather:
      description: "Look up current weather for a city"
      input_schema:
        type: object
        properties:
          city: { type: string }
        required: [city]
    get_local_time:
      description: "Look up the current local time for a city"
      input_schema:
        type: object
        properties:
          city: { type: string }
        required: [city]

when:
  - request: model
    response: { tool: get_weather, args: { city: "Tokyo" } }
  - request: { tool: get_weather }
    response: { status: 200, body: { temp: 31 } }
  - request: model
    response: { tool: get_local_time, args: { city: "Tokyo" } }
  - request: { tool: get_local_time }
    response: { status: 200, body: { time: "14:05" } }
  - request: model
    response: "In Tokyo it is 31°C and the local time is 14:05."

then:
  run:
    status: completed
    output: { matches: "31.*14:05" }
