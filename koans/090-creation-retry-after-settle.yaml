name: creation-retry-after-settle
description: >
  The caller names the run, never sees its acceptance, and re-sends the
  identical creation — after the run has already settled. The resend
  lands on the run it already started: the same acceptance with the
  same run_id, the committed result untouched, and no second
  conversation — a run is created once, however late the caller's
  retry arrives (SPEC.md §3).

given:
  tools:
    get_weather:
      description: "Look up current weather for a city"
      input_schema:
        type: object
        properties:
          city: { type: string }
        required: [city]

prompt: "Get the current weather in Tokyo and report it."

when:
  - request: model
    response: { tool: get_weather, args: { city: "Tokyo" } }
  - request: { tool: get_weather }
    response: { status: 200, body: { temp: 31 } }
  - request: model
    response: "The weather in Tokyo is 31°C."
  # The identical creation, again — after the answer above committed.
  - retry: prompt

then:
  status: completed
  output: { contains: "31" }
