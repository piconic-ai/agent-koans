name: Release PR

on:
  push:
    branches: [main]
  pull_request:
    # A bump label on the release PR regenerates it with the new bump.
    types: [labeled, unlabeled]

permissions: {}

concurrency: ${{ github.workflow }}

jobs:
  regenerate:
    if: github.event_name == 'push' || github.head_ref == 'release/next'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release/next branch
      pull-requests: write # the release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always operate on main, whichever event woke us.
          ref: main
          fetch-depth: 0

      # Reads the pnpm version from the root package.json "packageManager" field
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin

          # A release is in flight while main's version is untagged; the
          # Release workflow is publishing it right now. Come back on the
          # next push.
          version=$(node -p "require('./package.json').version")
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null \
            && ! npm view "agent-koans@$version" version >/dev/null 2>&1; then
            echo "v$version is being published; skipping."
            exit 0
          fi

          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range="${last:+$last..}HEAD"
          # A GitHub merge commit carries the PR title as its body — but
          # not always, so fall back to the commit subject.
          changes=$(git log --merges --first-parent --format='%H' "$range" | while read -r sha; do
            line=$(git show -s --format='%b' "$sha" | head -1)
            [ -n "$line" ] && echo "$line" || git show -s --format='%s' "$sha"
          done)
          if [ -z "$changes" ]; then
            changes=$(git log --no-merges --first-parent --format='%s' "$range")
          fi

          pr=$(gh pr list --head release/next --state open --json number,labels \
            --jq '.[0].number // empty')

          if [ -z "$changes" ]; then
            echo "Nothing unreleased on main."
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch \
                --comment "Nothing left to release; closing until main moves again."
            fi
            exit 0
          fi

          bump=patch
          if [ -n "$pr" ]; then
            labels=$(gh pr view "$pr" --json labels --jq '.labels[].name')
            echo "$labels" | grep -qx major && bump=major
            echo "$labels" | grep -qx minor && [ "$bump" = patch ] && bump=minor
          fi

          {
            echo '---'
            echo "\"agent-koans\": $bump"
            echo '---'
            echo
            echo "$changes" | sed 's/^/- /'
          } > .changeset/release.md
          git checkout -b next-release
          git add .changeset/release.md
          git commit -m "Record the changes since ${last:-the first commit}"
          pnpm changeset version
          next=$(node -p "require('./package.json').version")
          git add -A
          git commit -m "Version v$next"
          git push --force origin next-release:release/next

          body=$(printf 'Merging releases everything below as v%s: npm publish, the v%s tag, and the GitHub release. Review CHANGELOG.md and edit the wording freely.\n\nThe default bump is patch — label this PR `minor` or `major` to change it. The PR regenerates on every push to main, so manual commits to it will be overwritten.' "$next" "$next")
          if [ -z "$pr" ]; then
            gh pr create --base main --head release/next \
              --title "Release v$next" --body "$body"
          else
            gh pr edit "$pr" --title "Release v$next" --body "$body"
          fi
