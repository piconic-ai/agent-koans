name: time-budget-per-submission
description: >
  The run declares a wall-clock budget, and two prompts each spend most
  of one. The budget belongs to a submission, not to the run: it starts
  again at every prompt the caller sends, so the second turn has the
  whole of it however long the first one took. An agent measuring from
  the run's own beginning would give up part-way through the second
  (SPEC.md §3).

given:
  tools:
    get_weather:
      description: "Look up current weather for a city"
      timeout_ms: 1500
      input_schema:
        type: object
        properties:
          city: { type: string }
        required: [city]
  limits:
    max_duration_ms: 2500

turns:
  - prompt: "Get the current weather in Tokyo and report it."
    when:
      - request: model
        response: { tool: get_weather, args: { city: "Tokyo" } }
      - request: { tool: get_weather }
        response: never
      # 1500ms of the 2500 spent waiting, and the turn still settles.
      - request: model
        response: "The weather service is not answering, so I have no reading for Tokyo."
    then:
      status: completed
      output: { contains: "no reading for Tokyo" }

  - prompt: "Try Osaka instead."
    when:
      - request: model
        response: { tool: get_weather, args: { city: "Osaka" } }
      - request: { tool: get_weather }
        response: never
      # Another 1500ms — past the budget for a run-wide clock, well
      # inside it for this submission's own.
      - request: model
        response: "Still nothing from the weather service, so I have no reading for Osaka either."
    then:
      status: completed
      output: { contains: "no reading for Osaka" }
