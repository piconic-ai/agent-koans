skip:
  014-malformed-arguments: "pi-ai's parseStreamingJson silently repairs malformed JSON via partial-json instead of erroring, has no strict mode, and useTool() never exposes the raw wire string to intercept (upstream: @earendil-works/pi-ai)."
  063-delegate-mid-task-fold: "A delegate's threshold arrives per run, but Flue resolves compaction from session-level config with no per-delegate override (SubagentDefinition carries no compaction field, and useModel() — the only hook that takes one — throws when called from a subagent render, requiring a delegate's model and compaction to be fixed at its useSubagent() declaration) and models — whose contextWindow is the only per-delegate lever — are registered once at start(); the example's delegates deliberately run on an unbounded-window model so undeclared delegates never fold (koans/060), which also means a declared threshold cannot fire (upstream: @flue/runtime)."
