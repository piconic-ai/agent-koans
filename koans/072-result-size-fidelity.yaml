name: result-size-fidelity
description: >
  A tool's result comes back large — tens of kilobytes, well past
  anything else in the suite. The agent must forward it to the model
  whole: nothing here says a size earns different treatment, and no
  declared tool's result is truncated, summarized, or otherwise
  altered on its way to the model (SPEC.md §4).

given:
  tools:
    fetch_report:
      description: "Fetch an incident report by id"
      input_schema:
        type: object
        properties:
          id: { type: string }
        required: [id]

prompt: "Fetch incident report R-500 and tell me whether it confirms FINDING-ANCHOR-9182."

when:
  - request: model
    response: { tool: fetch_report, args: { id: "R-500" } }
