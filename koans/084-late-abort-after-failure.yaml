name: late-abort-after-failure
description: >
  A run that already settled `failed` is aborted. A settled run keeps
  the state it settled on, and that holds for the outcome an agent
  would rather forget as much as for a successful one: the abort is
  accepted and the run stays `failed`, never rewritten to `aborted`
  (SPEC.md §3).

given:
  tools:
    get_weather:
      description: "Look up current weather for a city"
      input_schema:
        type: object
        properties:
          city: { type: string }
        required: [city]

prompt: "Get the current weather in Tokyo and report it."

when:
  - request: model
    response: { tool: get_weather, args: { city: "Tokyo" } }
  - request: { tool: get_weather }
    response: { status: 200, body: { temp: 31 } }
  # The endpoint refuses the request that would have reported the reading.
  - request: model
    response: { status: 401 }
  - abort

then:
  status: failed
