name: workspace-read
description: >
  The main conversation reads a workspace file directly, with no
  subagent involved. "read_file" names a tool the run did not declare,
  so it must not reach the tool server; its request carries no response,
  since the agent answers it itself, and the file's content must flow
  into the conversation's next model request and the final answer.

given:
  files:
    report.md: "2026-08-09 03:12 UTC: checkout returned 503 for 4 minutes. Incident code INC-4407."

prompt: "Summarize the incident. The details are in report.md."

when:
  - request: model
    response: { tool: read_file, args: { path: "report.md" } }
  - request: { tool: read_file }
  - request: model
    response: "Summary: a 4-minute 503 outage, incident INC-4407."

then:
  status: completed
  output: { contains: "INC-4407" }
