name: Changeset check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  # The release PR — the one the changesets action maintains (fixed
  # head branch), or anything a human marks with the release label —
  # must consume changesets and leave no drafts behind.
  release-gate:
    if: github.head_ref == 'changeset-release/main' || contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The release consumes changesets and leaves no drafts
        run: |
          git fetch origin "$GITHUB_BASE_REF"
          consumed=$(git diff --name-only --diff-filter=D "origin/${GITHUB_BASE_REF}...HEAD" -- '.changeset/*.md')
          if [ -z "$consumed" ]; then
            echo "This release PR consumes no changesets." >&2
            echo "Polish the notes in release-drafts/ into .changeset/*.md first." >&2
            exit 1
          fi
          if ls release-drafts/*.md >/dev/null 2>&1; then
            echo "release-drafts/ still holds unpolished notes:" >&2
            ls release-drafts/*.md >&2
            echo "Rewrite them into .changeset/*.md and delete them before releasing." >&2
            exit 1
          fi
          echo "Changesets consumed:"
          echo "$consumed"

  # Everywhere else, a changeset is a misplaced draft: pnpm changeset
  # writes straight into .changeset/, and a file there becomes release
  # notes verbatim. Legitimate polishing is recognizable without any
  # label because it always deletes the drafts it rewrites.
  misplaced-changeset:
    if: github.head_ref != 'changeset-release/main' && !contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Changesets are born only by polishing drafts
        run: |
          git fetch origin "$GITHUB_BASE_REF"
          added=$(git diff --name-only --diff-filter=A "origin/${GITHUB_BASE_REF}...HEAD" -- '.changeset/*.md')
          polished=$(git diff --name-only --diff-filter=D "origin/${GITHUB_BASE_REF}...HEAD" -- 'release-drafts/*.md')
          if [ -n "$added" ] && [ -z "$polished" ]; then
            echo "This PR adds changesets without polishing any draft:" >&2
            echo "$added" >&2
            echo "A file in .changeset/ becomes release notes verbatim." >&2
            echo "Put rough notes in release-drafts/ instead. If this PR" >&2
            echo "really is a hand-made release polish, add the release label." >&2
            exit 1
          fi
          echo "No misplaced changesets."
