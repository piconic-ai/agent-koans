skip:
  014-malformed-arguments: "pi-ai's parseStreamingJson silently repairs malformed JSON via partial-json instead of erroring, has no strict mode, and useTool() never exposes the raw wire string to intercept (upstream: @earendil-works/pi-ai)."
  063-delegate-mid-task-fold: "A delegate's threshold arrives per run, but Flue resolves compaction from session-level config with no per-delegate override (SubagentDefinition carries no compaction field, and useModel() — the only hook that takes one — throws when called from a subagent render). The one per-delegate lever, a model whose start()-registered contextWindow encodes the threshold, was tried and does fire the fold at the declared size — but Flue then folds the delegate's in-flight tool batch and the task settles early with the summary as its result instead of finishing its work, so the contract still cannot be met; the example's delegates deliberately run on an unbounded-window model so no delegate ever folds (koans/060) (upstream: @flue/runtime)."
