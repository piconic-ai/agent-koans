name: Changeset check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  check:
    # Runs only on a release PR — head branch release/* or the release
    # label. Topic PRs carry no changesets and are not checked.
    if: startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The release branch carries changesets and the version bump
        run: |
          git fetch origin "$GITHUB_BASE_REF"
          changesets=$(git log --format= --name-only --diff-filter=A \
            "origin/${GITHUB_BASE_REF}..HEAD" -- '.changeset/*.md' | sort -u)
          if [ -z "$changesets" ]; then
            echo "No changeset was written on this release branch." >&2
            echo "Write them from what accumulated on main (pnpm changeset," >&2
            echo "one per user-visible change), commit, then run" >&2
            echo "pnpm changeset version in a separate commit so the" >&2
            echo "changesets stay visible in the branch history." >&2
            exit 1
          fi
          base_version=$(git show "origin/${GITHUB_BASE_REF}:package.json" \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          version=$(node -p "require('./package.json').version")
          if [ "$version" = "$base_version" ]; then
            echo "package.json still says $base_version — run pnpm changeset version." >&2
            exit 1
          fi
          echo "Changesets written:"
          echo "$changesets"
          echo "Version: $base_version -> $version"
