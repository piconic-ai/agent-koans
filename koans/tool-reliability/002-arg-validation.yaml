name: arg-validation
description: >
  The model first calls the tool with arguments that violate the input
  schema (required "city" is missing). The agent must reject the call
  without invoking the tool — there is no tool request in the trace —
  report a validation error back to the model, and then execute the
  corrected call.

given:
  task: "Get the current weather in Tokyo and report it."
  tools:
    get_weather:
      description: "Look up current weather for a city"
      input_schema:
        type: object
        properties:
          city: { type: string }
        required: [city]

when:
  - request: model
    response: { tool: get_weather, args: { town: "Tokyo" } }
  # no tool request here: the invalid call must never reach the tool server
  - request: model
    response: { tool: get_weather, args: { city: "Tokyo" } }
  - request: { tool: get_weather }
    response: { status: 200, body: { temp: 31 } }
  - request: model
    response: "The weather in Tokyo is 31°C."

then:
  run:
    status: completed
    output: { contains: "31" }
