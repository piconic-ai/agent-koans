name: idempotent-creation
description: >
  The caller names the run (`run_id` in the creation request) and, never
  having seen its acceptance, sends the identical creation again while
  the run is still working. The resend must land on the same run — the
  same acceptance with the same run_id — and must not start a second
  conversation: one tool invocation, one answer.

given:
  tools:
    get_weather:
      description: "Look up current weather for a city"
      input_schema:
        type: object
        properties:
          city: { type: string }
        required: [city]

prompt: "Get the current weather in Tokyo and report it."

when:
  - request: model
    response: { tool: get_weather, args: { city: "Tokyo" } }
  # Held open while the caller re-sends: the run provably has not
  # settled when the duplicate creation arrives.
  - request: { tool: get_weather }
    response: { status: 200, body: { temp: 31 } }
  - retry: prompt
  - request: model
    response: "The weather in Tokyo is 31°C."

then:
  status: completed
  output: { contains: "31" }
