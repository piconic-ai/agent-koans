name: workspace-read
description: >
  The main conversation reads a workspace file directly, with no
  subagent involved. "read_file" names a tool the run did not declare,
  so R7 forbids it from reaching the tool server; naming a given.files
  entry as args.path marks it instead as the agent's own internal read,
  whose content must flow into the conversation's next model request and
  the final answer.

given:
  files:
    report.md: "2026-08-09 03:12 UTC: checkout returned 503 for 4 minutes. Incident code INC-4407."

prompt: "Summarize the incident. The details are in report.md."

when:
  - request: model
    response: { tool: read_file, args: { path: "report.md" } }
  # No tool request: read_file is the agent's own tool, executed
  # against KOAN_WORKSPACE (SPEC.md §5 R7), never the mock tool server.
  - request: model
    response: "Summary: a 4-minute 503 outage, incident INC-4407."

then:
  status: completed
  output: { contains: "INC-4407" }
