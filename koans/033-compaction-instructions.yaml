name: compaction-instructions
description: >
  The caller asks for a fold and says what it must keep. Asking is a kind
  of prompting: the words are the caller's, they are about the summary
  rather than the task, and an agent may no more reword them than it may
  reword a prompt. So the summarizing request must carry them, and the
  summary that comes back must reach the conversation the way any other
  fold's does.

given:
  context:
    window: 100000
    compaction: off
  tools:
    lookup_incident:
      description: "Look up an incident record by id"
      input_schema:
        type: object
        properties:
          id: { type: string }
        required: [id]

turns:
  - prompt: "Look up incident INC-4407 and confirm it is logged."
    when:
      - request: model
        response: { tool: lookup_incident, args: { id: "INC-4407" } }
      - request: { tool: lookup_incident }
        response: { status: 200, body: { operator_code: "K-9-4471" } }
      - request: model
        response:
          body: "Incident INC-4407 is logged."
          used_tokens: 40000

  - compact: "Keep every operator code verbatim."
    when:
      - request:
          type: model
          purpose: compaction
        response:
          body: "Earlier: incident INC-4407 has operator code K-9-4471."
          used_tokens: 8000
          compaction: completed

  - prompt: "What was that incident's operator code?"
    when:
      - request: model
        response: "The operator code is K-9-4471."
    then:
      status: completed
      output: { contains: "K-9-4471" }
