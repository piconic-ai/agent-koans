name: repeated-calls
description: >
  A task that requires the same tool twice with different arguments. The
  agent must invoke it once per city, feed each result back to the model
  in turn, and only then report the comparison.

given:
  task: "Compare the current temperature in Tokyo and Osaka."
  tools:
    get_weather:
      description: "Look up current weather for a city"
      input_schema:
        type: object
        properties:
          city: { type: string }
        required: [city]

when:
  - request: model
    response: { tool: get_weather, args: { city: "Tokyo" } }
  - request: { tool: get_weather }
    response: { status: 200, body: { temp: 31 } }
  - request: model
    response: { tool: get_weather, args: { city: "Osaka" } }
  - request: { tool: get_weather }
    response: { status: 200, body: { temp: 33 } }
  - request: model
    response: "Osaka (33°C) is warmer than Tokyo (31°C)."

then:
  run:
    status: completed
    output: { matches: "33.*31|31.*33" }
