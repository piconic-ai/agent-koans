name: parallel-tool-calls
description: >
  The model requests two independent tools in one response (one assistant
  message, two tool_calls). The agent must invoke both — in any order,
  sequentially or concurrently — close each with its own tool message,
  and only then report the combined answer.

given:
  tools:
    get_weather:
      description: "Look up current weather for a city"
      input_schema:
        type: object
        properties:
          city: { type: string }
        required: [city]
    get_local_time:
      description: "Look up the current local time for a city"
      input_schema:
        type: object
        properties:
          city: { type: string }
        required: [city]

prompt: "Report the current weather and local time in Tokyo."

when:
  - request: model
    response:
      - { tool: get_weather, args: { city: "Tokyo" } }
      - { tool: get_local_time, args: { city: "Tokyo" } }
  - request: { tool: get_weather }
    response: { status: 200, body: { temp: 31 } }
  - request: { tool: get_local_time }
    response: { status: 200, body: { time: "14:05" } }
  - request: model
    response: "In Tokyo it is 31°C and the local time is 14:05."

then:
  status: completed
  output: { contains: "31" }
