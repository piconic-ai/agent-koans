name: compaction-failure-no-room
description: >
  The same refusal as 031, against a full window. The first turn fills the
  conversation to the size the run declared, so the fold the threshold
  forces is the only way on — and it is refused. There is no room left for
  another model request, so the run ends instead of asking for one. The
  window is what decides that, which is why the two koans differ in one
  number and nothing else.

given:
  context:
    window: 100000
    compaction: 90%
  tools:
    lookup_incident:
      description: "Look up an incident record by id"
      input_schema:
        type: object
        properties:
          id: { type: string }
        required: [id]

turns:
  - prompt: "Look up incident INC-4407 and confirm it is logged."
    when:
      - request: model
        response: { tool: lookup_incident, args: { id: "INC-4407" } }
      - request: { tool: lookup_incident }
        response: { status: 200, body: { operator_code: "K-9-4471" } }
      - request: model
        response:
          body: "Incident INC-4407 is logged."
          used_tokens: 100000

  - prompt: "What was that incident's operator code?"
    when:
      - request:
          type: model
          purpose: compaction
        response:
          status: 400
          body: { error: "summarizer_unavailable" }
          compaction: failed
    then:
      status: failed
