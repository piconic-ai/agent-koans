name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the vX.Y.Z tag and the GitHub release
      # npm trusted publishing: the OIDC token replaces any npm token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A push releases exactly when the version it carries is untagged —
      # true after a release PR merges, false for every other push.
      - name: Decide whether this push releases
        id: decide
        run: |
          git fetch --tags --force origin
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Reads the pnpm version from the root package.json "packageManager" field
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.decide.outputs.release == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.decide.outputs.release == 'true'
        with:
          # Trusted publishing needs npm >= 11.5.1; node 24 bundles it.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - if: steps.decide.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run the suite before publishing
        if: steps.decide.outputs.release == 'true'
        run: |
          pnpm typecheck
          pnpm test

      - name: Publish to npm
        if: steps.decide.outputs.release == 'true'
        run: npm publish

      - name: Tag and create the GitHub release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.decide.outputs.version }}"
          git tag "$v"
          git push origin "$v"
          notes=$(awk -v ver="${{ steps.decide.outputs.version }}" \
            '$0 == "## " ver {flag=1; next} /^## / {flag=0} flag' CHANGELOG.md)
          gh release create "$v" --title "$v" --notes "${notes:-See CHANGELOG.md}"
