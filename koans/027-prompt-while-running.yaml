name: prompt-while-running
description: >
  A second prompt is delivered while the run is still running — during a
  tool invocation the mock holds open, so the run provably has not
  settled. The agent must accept it, must not lose it, and must still
  settle with an answer to it. Two processes are acceptable, and the koan
  is silent about which: join the live conversation at the next turn
  boundary, or queue the prompt as its own turn once the first prompt's
  work settles. Either way the held tool call is still closed. A delivery at
  any other moment of a run is not covered.

given:
  tools:
    get_weather:
      description: "Look up current weather for a city"
      input_schema:
        type: object
        properties:
          city: { type: string }
        required: [city]

prompt: "Get the current weather in Tokyo and report it."

one_of:
  join-at-the-next-boundary:
    - request: model
      response: { tool: get_weather, args: { city: "Tokyo" } }
    - request: { tool: get_weather }
      response: { status: 200, body: { temp: 31 } }
      prompt: "Also say what that is in Fahrenheit."
    # One request closes the held call and carries the delivered prompt.
    - request: model
      response: "Tokyo is at 31°C, which is 88°F."

  queue-as-its-own-turn:
    - request: model
      response: { tool: get_weather, args: { city: "Tokyo" } }
    - request: { tool: get_weather }
      response: { status: 200, body: { temp: 31 } }
      prompt: "Also say what that is in Fahrenheit."
    - request: model
      response: "Tokyo is at 31°C."
    # The queued turn: a model request after a reply can only be the
    # delivery re-opening the run, which is what marks this variant.
    - request: model
      response: "31°C is 88°F."

then:
  status: completed
  output: { contains: "88" }
